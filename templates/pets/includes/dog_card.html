<div class="dog-card">
    <a href="{% url 'pets:dog_detail' dog.pk %}" class="dog-card-link">
        <div class="dog-img-wrapper">
            {% if dog.is_popular %}
            <span class="popular-badge">🔥 热门</span>
            {% endif %}
            <img class="dog-img" src="{{ dog.image_url }}" alt="{{ dog.name }}" loading="lazy">
        </div>
        <div class="dog-info">
            <div class="dog-name">{{ dog.name }}</div>
            <div class="dog-category">{{ dog.category.icon }} {{ dog.category.name }}</div>
            <div class="dog-tags">
                {% if dog.origin %}
                    <span class="tag">🌍 {{ dog.origin }}</span>
                {% endif %}
                {% if dog.lifespan %}
                    <span class="tag">⏳ {{ dog.lifespan }}</span>
                {% endif %}
                {% if dog.weight %}
                    <span class="tag">⚖️ {{ dog.weight }}</span>
                {% endif %}
            </div>
        </div>
    </a>
    <div class="dog-card-actions">
        <span class="dog-price">¥{{ dog.price }} <small>起</small></span>
        <a href="{% url 'pets:add_dog_to_cart' dog.pk %}" class="dog-add-btn">
            🛒 加入购物车
        </a>
    </div>
</div>

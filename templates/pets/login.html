{% extends 'pets/base.html' %}
{% load static %}

{% block title %}🔐 登录 - 里脊球的宠物店{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>🔐 欢迎回来</h2>
        <p class="auth-subtitle">登录你的账号，解锁更多功能</p>

        {% if form.errors %}
        <div class="alert alert-error">
            用户名或密码错误，请重试。
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">用户名</label>
                <input type="text" name="username" id="id_username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">密码</label>
                <input type="password" name="password" id="id_password" placeholder="请输入密码" required>
            </div>
            <button type="submit" style="width:100%;padding:0.75rem;background:linear-gradient(135deg,var(--pink),var(--coral));color:white;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;">登 录</button>
        </form>

        <div class="auth-footer">
            还没有账号？<a href="{% url 'pets:register' %}">立即注册</a>
        </div>
    </div>
</section>
{% endblock %}

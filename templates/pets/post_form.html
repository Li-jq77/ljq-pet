{% extends 'pets/base.html' %}
{% block title %}发布帖子 - 宠友圈{% endblock %}

{% block extra_css %}
<style>
.post-form-shell {
    width: min(900px, calc(100% - 3rem));
    margin: 0 auto;
    padding: 2rem 0 4rem;
}

.post-form-card {
    padding: 2rem;
    background: white;
    border-radius: 20px;
    box-shadow: 0 3px 18px var(--shadow);
}

.post-form-card h1 {
    margin: 0 0 0.25rem;
    text-align: center;
    color: var(--brown);
    font-size: 1.35rem;
}

.post-form-card > p {
    margin: 0 0 1.5rem;
    text-align: center;
    color: var(--text-light);
    font-size: 0.86rem;
}

.post-form-group {
    margin-bottom: 1rem;
}

.post-form-group label {
    display: block;
    margin-bottom: 0.3rem;
    color: var(--text);
    font-size: 0.84rem;
    font-weight: 600;
}

.post-form-group input,
.post-form-group select,
.post-form-group textarea {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1.5px solid #eee;
    border-radius: 12px;
    outline: none;
    background: var(--cream);
    color: var(--text);
    font: inherit;
    box-sizing: border-box;
}

.post-form-group textarea {
    resize: vertical;
}

.post-form-submit {
    width: 100%;
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--pink), var(--coral));
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--shadow);
}

.post-form-back {
    display: block;
    margin-top: 1rem;
    text-align: center;
    color: var(--pink);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
}

@media (max-width: 600px) {
    .post-form-shell {
        width: calc(100% - 1.4rem);
        padding: 1.3rem 0 3rem;
    }

    .post-form-card {
        padding: 1.2rem;
    }
}
</style>
{% endblock %}

{% block content %}
<main class="post-form-shell">
    <section class="post-form-card">
        <h1>✏️ 发布帖子</h1>
        <p>分享养宠日常或寻求帮助</p>

        <form method="post">
            {% csrf_token %}
            <div class="post-form-group">
                <label for="post-category">帖子类型</label>
                <select id="post-category" name="category">
                    <option value="share">🙌 日常分享</option>
                    <option value="help">🆘 求助</option>
                </select>
            </div>
            <div class="post-form-group">
                <label for="post-title">标题</label>
                <input id="post-title" type="text" name="title" required>
            </div>
            <div class="post-form-group">
                <label for="post-content">内容</label>
                <textarea id="post-content" name="content" rows="7" required></textarea>
            </div>
            <div class="post-form-group">
                <label for="post-image">图片链接（选填）</label>
                <input id="post-image" type="url" name="image_url" placeholder="https://...">
            </div>
            <button type="submit" class="post-form-submit">📢 发布</button>
        </form>

        <a href="{% url 'pets:post_list' %}" class="post-form-back">← 返回列表</a>
    </section>
</main>
{% endblock %}

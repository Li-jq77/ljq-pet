{% extends 'pets/base.html' %}
{% block title %}删除宠物 - 里脊球的宠物店{% endblock %}
{% block content %}
<div style="padding:2rem;max-width: 800px;margin:0 auto;">
    <div style="background:white;border-radius:24px;padding:2rem;text-align:center;box-shadow:0 4px 25px var(--shadow);">
        <span style="font-size:3rem;display:block;margin-bottom:0.5rem;">😢</span>
        <h2 style="color:var(--brown);margin-bottom:0.5rem;">确认删除 {{ pet.name }}？</h2>
        <p style="color:var(--text-light);font-size:0.85rem;margin-bottom:1.5rem;">此操作不可撤销，该宠物的所有健康记录也将被删除。</p>
        <form method="post">
            {% csrf_token %}
            <div style="display:flex;gap:1rem;justify-content:center;">
                <button type="submit" style="padding:0.5rem 1.5rem;background:var(--coral);color:white;border:none;border-radius:50px;font-weight:600;cursor:pointer;">确认删除</button>
                <a href="{% url 'pets:pet_detail' pet.pk %}" style="padding:0.5rem 1.5rem;background:white;color:var(--text);border-radius:50px;text-decoration:none;font-weight:600;box-shadow:0 2px 10px var(--shadow);">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

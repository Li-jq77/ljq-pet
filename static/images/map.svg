<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" style="border-radius:16px;box-shadow:0 3px 15px rgba(0,0,0,0.08);">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE8EC"/>
      <stop offset="100%" stop-color="#FFF5E4"/>
    </linearGradient>
    <linearGradient id="bgGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5E0B5"/>
      <stop offset="100%" stop-color="#A8E6CF"/>
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="400" height="260" fill="url(#bgSky)" rx="16"/>
  <!-- Cute clouds -->
  <ellipse cx="70" cy="35" rx="35" ry="14" fill="white" opacity="0.7"/>
  <ellipse cx="95" cy="30" rx="25" ry="10" fill="white" opacity="0.6"/>
  <ellipse cx="320" cy="45" rx="30" ry="12" fill="white" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="175" width="400" height="85" fill="url(#bgGrass)" rx="0"/>
  <!-- Cute road -->
  <rect x="0" y="188" width="400" height="20" rx="3" fill="#F5F0EB"/>
  <line x1="0" y1="198" x2="400" y2="198" stroke="#E0D5CC" stroke-width="1.5" stroke-dasharray="6,5"/>
  <!-- Tiny cute buildings -->
  <rect x="35" y="150" width="22" height="25" rx="4" fill="#FFD3B6" stroke="#E8B88A" stroke-width="1"/>
  <rect x="40" y="155" width="4" height="4" rx="1" fill="#FFF"/>
  <rect x="48" y="155" width="4" height="4" rx="1" fill="#FFF"/>
  <rect x="62" y="153" width="18" height="22" rx="4" fill="#DCD3FF" stroke="#BCB0E8" stroke-width="1"/>
  <rect x="66" y="158" width="4" height="4" rx="1" fill="#FFF"/>
  <rect x="345" y="148" width="20" height="27" rx="4" fill="#A8E6CF" stroke="#88C9A6" stroke-width="1"/>
  <rect x="349" y="153" width="4" height="4" rx="1" fill="#FFF"/>
  <rect x="355" y="153" width="4" height="4" rx="1" fill="#FFF"/>
  <!-- Cute trees -->
  <circle cx="120" cy="168" r="12" fill="#7EC8A8" opacity="0.7"/>
  <circle cx="120" cy="163" r="9" fill="#A8E6CF" opacity="0.6"/>
  <circle cx="290" cy="165" r="10" fill="#7EC8A8" opacity="0.7"/>
  <circle cx="290" cy="160" r="8" fill="#A8E6CF" opacity="0.6"/>
  <!-- Cute paw print trail -->
  <text x="185" y="200" font-size="14" opacity="0.3" font-family="sans-serif">🐾 🐾 🐾</text>
  <!-- Cute heart marker -->
  <text x="200" y="140" font-size="45" text-anchor="middle">💖</text>
  <!-- Cute store badge -->
  <rect x="130" y="78" width="140" height="32" rx="16" fill="white" stroke="#FF9A9E" stroke-width="2"/>
  <text x="200" y="99" font-size="13" text-anchor="middle" fill="#FF6B8A" font-weight="bold" font-family="sans-serif">🐾 里脊球的宠物店</text>
  <!-- Address label -->
  <rect x="115" y="228" width="170" height="24" rx="12" fill="white" opacity="0.8"/>
  <text x="200" y="244" font-size="10" text-anchor="middle" fill="#8D6E63" font-weight="500" font-family="sans-serif">📍 花都区培正路53号 · 培正学院</text>
</svg>